<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PIXEL RIOT — SNAKE</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #080808;
            color: #fff;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* CRT EFFECT */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 20;

            background:
                repeating-linear-gradient(to bottom,
                    rgba(255, 255, 255, .035) 0px,
                    rgba(255, 255, 255, .035) 1px,
                    transparent 1px,
                    transparent 4px);
        }

        .game {
            width: min(520px, 94vw);
            text-align: center;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;

            text-shadow:
                3px 0 #ff1744,
                -3px 0 #00e5ff;
        }

        .back {
            background: #111;
            color: #fff;
            border: 2px solid #fff;
            padding: 8px 12px;

            font-family: monospace;
            font-weight: 900;

            cursor: pointer;
        }

        .back:hover {
            background: #fff;
            color: #000;
        }

        .gamebox {
            position: relative;
            width: min(500px, 92vw);
            margin: auto;

            background: #050505;

            border: 4px solid #fff;

            box-shadow:
                8px 8px #ff1744,
                14px 14px #00e5ff;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;

            background: #090c0b;

            image-rendering: pixelated;
        }

        .hud {
            display: flex;
            justify-content: space-between;

            padding: 12px 14px;

            background: #090909;

            border-bottom: 3px solid #fff;

            font-weight: 900;
            letter-spacing: 1px;
        }

        .score {
            color: #4cff8a;
        }

        .best {
            color: #00e5ff;
        }

        .overlay {
            position: absolute;
            inset: 0;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            background: rgba(0, 0, 0, .78);

            z-index: 5;
        }

        .overlay.hidden {
            display: none;
        }

        .title {
            font-size: clamp(38px, 10vw, 64px);
            font-weight: 900;

            letter-spacing: 4px;

            text-shadow:
                5px 0 #ff1744,
                -5px 0 #00e5ff;

            margin-bottom: 12px;
        }

        .subtitle {
            color: #aaa;
            font-size: 13px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .button {
            background: #fff;
            color: #000;

            border: 3px solid #fff;

            padding: 14px 24px;

            font-family: monospace;
            font-size: 14px;
            font-weight: 900;

            cursor: pointer;

            box-shadow: 6px 6px #ff1744;
        }

        .button:hover {
            transform: translate(2px, 2px);
            box-shadow: 4px 4px #ff1744;
        }

        .tip {
            margin-top: 18px;

            color: #555;

            font-size: 11px;

            letter-spacing: 2px;
        }

        @media(max-width:600px) {

            .logo {
                font-size: 19px;
            }

            .back {
                font-size: 11px;
                padding: 7px 9px;
            }

            .hud {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="game">

        <div class="topbar">

            <div class="logo">
                PIXEL RIOT
            </div>

            <button class="back" onclick="location.href='alone.html'">
                ← BACK
            </button>

        </div>


        <div class="gamebox">

            <div class="hud">

                <div>
                    SCORE:
                    <span class="score" id="score">
                        0
                    </span>
                </div>

                <div>
                    BEST:
                    <span class="best" id="best">
                        0
                    </span>
                </div>

            </div>


            <canvas id="game" width="600" height="600">
            </canvas>


            <!-- START SCREEN -->

            <div class="overlay" id="startScreen">

                <div class="title">
                    SNAKE
                </div>

                <div class="subtitle">
                    EAT. GROW. DON'T DIE.<br>
                    USE WASD OR ARROW KEYS.
                </div>

                <button class="button" id="startButton">
                    START RIOT
                </button>

            </div>


            <!-- GAME OVER -->

            <div class="overlay hidden" id="gameOverScreen">

                <div class="title">
                    DEAD.
                </div>

                <div class="subtitle">
                    FINAL SCORE:
                    <strong id="finalScore">
                        0
                    </strong>
                </div>

                <button class="button" id="restartButton">
                    TRY AGAIN
                </button>

            </div>

        </div>


        <div class="tip">
            WASD / ARROWS · SPACE = PAUSE
        </div>

    </div>


    <script>

        /* =========================================
           CANVAS
        ========================================= */

        const canvas =
            document.getElementById("game");

        const ctx =
            canvas.getContext("2d");


        /* =========================================
           UI
        ========================================= */

        const scoreElement =
            document.getElementById("score");

        const bestElement =
            document.getElementById("best");

        const finalScoreElement =
            document.getElementById("finalScore");

        const startScreen =
            document.getElementById("startScreen");

        const gameOverScreen =
            document.getElementById("gameOverScreen");

        const startButton =
            document.getElementById("startButton");

        const restartButton =
            document.getElementById("restartButton");


        /* =========================================
           GAME SETTINGS
        ========================================= */

        const GRID = 30;

        const CELL =
            canvas.width / GRID;

        const START_SPEED = 105;


        /* =========================================
           GAME STATE
        ========================================= */

        let snake;

        let food;

        let direction;

        let nextDirection;

        let score;

        let best =
            Number(
                localStorage.getItem(
                    "pixelRiotSnakeBest"
                ) || 0
            );

        let running = false;

        let paused = false;

        let gameTimer = null;


        /* =========================================
           BEST SCORE
        ========================================= */

        bestElement.textContent = best;


        /* =========================================
           RESET GAME
        ========================================= */

        function resetGame() {

            snake = [

                {
                    x: 15,
                    y: 15
                },

                {
                    x: 14,
                    y: 15
                },

                {
                    x: 13,
                    y: 15
                }

            ];


            direction = {
                x: 1,
                y: 0
            };


            nextDirection = {
                x: 1,
                y: 0
            };


            score = 0;

            paused = false;

            scoreElement.textContent = "0";


            spawnFood();

            draw();
        }


        /* =========================================
           START GAME
        ========================================= */

        function startGame() {

            resetGame();

            running = true;

            startScreen.classList.add("hidden");

            gameOverScreen.classList.add("hidden");

            clearInterval(gameTimer);

            gameTimer =
                setInterval(
                    update,
                    START_SPEED
                );
        }


        /* =========================================
           GAME OVER
        ========================================= */

        function gameOver() {

            running = false;

            clearInterval(gameTimer);

            finalScoreElement.textContent =
                score;


            if (score > best) {

                best = score;

                localStorage.setItem(
                    "pixelRiotSnakeBest",
                    best
                );

                bestElement.textContent =
                    best;
            }


            gameOverScreen.classList.remove(
                "hidden"
            );
        }


        /* =========================================
           FOOD
        ========================================= */

        function spawnFood() {

            let valid = false;

            while (!valid) {

                food = {

                    x:
                        Math.floor(
                            Math.random() * GRID
                        ),

                    y:
                        Math.floor(
                            Math.random() * GRID
                        )

                };


                valid =
                    !snake.some(
                        segment =>
                            segment.x === food.x &&
                            segment.y === food.y
                    );
            }
        }


        /* =========================================
           UPDATE
        ========================================= */

        function update() {

            if (!running || paused) {
                return;
            }


            direction =
                nextDirection;


            const head = {

                x:
                    snake[0].x +
                    direction.x,

                y:
                    snake[0].y +
                    direction.y

            };


            /* WALL COLLISION */

            if (
                head.x < 0 ||
                head.x >= GRID ||
                head.y < 0 ||
                head.y >= GRID
            ) {

                gameOver();

                return;
            }


            /* SELF COLLISION */

            if (
                snake.some(
                    segment =>
                        segment.x === head.x &&
                        segment.y === head.y
                )
            ) {

                gameOver();

                return;
            }


            snake.unshift(head);


            /* FOOD */

            if (
                head.x === food.x &&
                head.y === food.y
            ) {

                score++;

                scoreElement.textContent =
                    score;

                spawnFood();

            } else {

                snake.pop();

            }


            draw();
        }


        /* =========================================
           DRAW BACKGROUND
        ========================================= */

        function drawBackground() {

            ctx.fillStyle =
                "#090c0b";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            /* GRID */

            ctx.strokeStyle =
                "rgba(255,255,255,.035)";

            ctx.lineWidth = 1;


            for (
                let i = 0;
                i <= GRID;
                i++
            ) {

                const pos =
                    i * CELL;


                ctx.beginPath();

                ctx.moveTo(
                    pos,
                    0
                );

                ctx.lineTo(
                    pos,
                    canvas.height
                );

                ctx.stroke();


                ctx.beginPath();

                ctx.moveTo(
                    0,
                    pos
                );

                ctx.lineTo(
                    canvas.width,
                    pos
                );

                ctx.stroke();

            }
        }


        /* =========================================
           DRAW FOOD
        ========================================= */

        function drawFood() {

            const x =
                food.x * CELL;

            const y =
                food.y * CELL;


            /* outer */

            ctx.fillStyle =
                "#ff1744";

            ctx.fillRect(
                x + 5,
                y + 5,
                CELL - 10,
                CELL - 10
            );


            /* center */

            ctx.fillStyle =
                "#ff4969";

            ctx.fillRect(
                x + 9,
                y + 9,
                CELL - 18,
                CELL - 18
            );
        }


        /* =========================================
           DRAW SNAKE
        ========================================= */

        function drawSnake() {

            snake.forEach(
                (segment, index) => {

                    const x =
                        segment.x * CELL;

                    const y =
                        segment.y * CELL;


                    if (index === 0) {

                        /* HEAD */

                        ctx.fillStyle =
                            "#4cff8a";

                        ctx.fillRect(
                            x + 2,
                            y + 2,
                            CELL - 4,
                            CELL - 4
                        );


                        /* EYES */

                        ctx.fillStyle =
                            "#050505";


                        if (direction.x !== 0) {

                            const eyeX =
                                direction.x > 0
                                    ? x + CELL - 10
                                    : x + 6;

                            ctx.fillRect(
                                eyeX,
                                y + 6,
                                4,
                                4
                            );

                            ctx.fillRect(
                                eyeX,
                                y + CELL - 10,
                                4,
                                4
                            );

                        } else {

                            const eyeY =
                                direction.y > 0
                                    ? y + CELL - 10
                                    : y + 6;

                            ctx.fillRect(
                                x + 6,
                                eyeY,
                                4,
                                4
                            );

                            ctx.fillRect(
                                x + CELL - 10,
                                eyeY,
                                4,
                                4
                            );
                        }

                    } else {

                        /* BODY */

                        ctx.fillStyle =
                            index % 2 === 0
                                ? "#26d96d"
                                : "#20bd5c";

                        ctx.fillRect(
                            x + 3,
                            y + 3,
                            CELL - 6,
                            CELL - 6
                        );

                    }

                }
            );
        }


        /* =========================================
           DRAW PAUSE
        ========================================= */

        function drawPause() {

            if (!paused) {
                return;
            }


            ctx.fillStyle =
                "rgba(0,0,0,.65)";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            ctx.fillStyle =
                "#fff";

            ctx.textAlign =
                "center";

            ctx.font =
                "900 42px monospace";

            ctx.fillText(
                "PAUSED",
                canvas.width / 2,
                canvas.height / 2
            );
        }


        /* =========================================
           DRAW
        ========================================= */

        function draw() {

            drawBackground();

            drawFood();

            drawSnake();

            drawPause();
        }


        /* =========================================
           CHANGE DIRECTION
        ========================================= */

        function changeDirection(
            x,
            y
        ) {

            /* Prevent 180° turns */

            if (
                x === -direction.x &&
                y === -direction.y
            ) {

                return;
            }


            nextDirection = {
                x: x,
                y: y
            };
        }


        /* =========================================
           KEYBOARD
        ========================================= */

        document.addEventListener(
            "keydown",
            function (event) {

                const key =
                    event.key.toLowerCase();


                if (
                    [
                        "arrowup",
                        "arrowdown",
                        "arrowleft",
                        "arrowright",
                        " "
                    ].includes(key)
                ) {

                    event.preventDefault();

                }


                /* UP */

                if (
                    key === "arrowup" ||
                    key === "w"
                ) {

                    changeDirection(
                        0,
                        -1
                    );

                }


                /* DOWN */

                if (
                    key === "arrowdown" ||
                    key === "s"
                ) {

                    changeDirection(
                        0,
                        1
                    );

                }


                /* LEFT */

                if (
                    key === "arrowleft" ||
                    key === "a"
                ) {

                    changeDirection(
                        -1,
                        0
                    );

                }


                /* RIGHT */

                if (
                    key === "arrowright" ||
                    key === "d"
                ) {

                    changeDirection(
                        1,
                        0
                    );

                }


                /* PAUSE */

                if (key === " ") {

                    if (running) {

                        paused =
                            !paused;

                        draw();

                    }

                }

            }
        );


        /* =========================================
           BUTTONS
        ========================================= */

        startButton.addEventListener(
            "click",
            startGame
        );

        restartButton.addEventListener(
            "click",
            startGame
        );


        /* =========================================
           MOBILE TOUCH CONTROLS
        ========================================= */

        let touchStartX = 0;
        let touchStartY = 0;


        canvas.addEventListener(
            "touchstart",
            function (event) {

                const touch =
                    event.changedTouches[0];

                touchStartX =
                    touch.clientX;

                touchStartY =
                    touch.clientY;

            },
            {
                passive: true
            }
        );


        canvas.addEventListener(
            "touchend",
            function (event) {

                const touch =
                    event.changedTouches[0];

                const dx =
                    touch.clientX -
                    touchStartX;

                const dy =
                    touch.clientY -
                    touchStartY;


                if (
                    Math.abs(dx) <
                    20 &&
                    Math.abs(dy) <
                    20
                ) {

                    return;
                }


                if (
                    Math.abs(dx) >
                    Math.abs(dy)
                ) {

                    if (dx > 0) {

                        changeDirection(
                            1,
                            0
                        );

                    } else {

                        changeDirection(
                            -1,
                            0
                        );

                    }

                } else {

                    if (dy > 0) {

                        changeDirection(
                            0,
                            1
                        );

                    } else {

                        changeDirection(
                            0,
                            -1
                        );

                    }

                }

            },
            {
                passive: true
            }
        );


        /* =========================================
           INITIAL SCREEN
        ========================================= */

        resetGame();

    </script>

</body>

</html>
