<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PIXEL RIOT</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at center, #202020 0%, #090909 50%, #000 100%);
    color: white;
    font-family: "Courier New", monospace;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

/* CRT SCANLINES */
body::before {
    content: "";
    position: fixed;
    inset: 0;

    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.025) 0px,
        rgba(255,255,255,0.025) 1px,
        transparent 1px,
        transparent 4px
    );

    pointer-events: none;
    z-index: 20;
}

/* MAIN */
.screen {
    width: min(1100px, 92%);
    text-align: center;
    position: relative;
    z-index: 2;
}

/* LOGO */
.logo {
    font-size: clamp(3.2rem, 9vw, 7.5rem);
    font-weight: 900;

    letter-spacing: -6px;
    line-height: 0.9;

    color: white;

    text-shadow:
        5px 5px 0 #ff1744,
        10px 10px 0 #00e5ff;

    animation: glitch 3s infinite;
}

.tagline {
    margin-top: 20px;

    color: #999;

    font-size: clamp(0.75rem, 2vw, 1.1rem);

    letter-spacing: 5px;
    text-transform: uppercase;
}

.question {
    margin-top: 65px;
    margin-bottom: 30px;

    font-size: clamp(1rem, 2.5vw, 1.4rem);

    letter-spacing: 4px;
}

/* MODE GRID */
.modes {
    display: grid;

    grid-template-columns: repeat(2, minmax(250px, 1fr));

    gap: 30px;

    max-width: 850px;

    margin: auto;
}

/* MODE CARD */
.mode {
    position: relative;

    min-height: 270px;

    padding: 35px 25px;

    background: #111;

    border: 4px solid white;

    cursor: pointer;

    user-select: none;

    transition:
        transform 0.15s ease,
        background 0.15s ease,
        box-shadow 0.15s ease;
}

/* INNER BORDER */
.mode::before {
    content: "";

    position: absolute;

    inset: 7px;

    border: 2px solid #444;

    pointer-events: none;
}

/* HOVER */
.mode:hover {
    transform: translate(-6px, -6px);

    background: #181818;

    box-shadow:
        8px 8px 0 #ff1744,
        14px 14px 0 #00e5ff;
}

/* CLICK */
.mode:active {
    transform: translate(3px, 3px);

    box-shadow: none;
}

/* ICON */
.icon {
    font-size: 4rem;

    margin-bottom: 20px;

    filter: grayscale(1);
}

/* TITLE */
.mode h2 {
    font-size: clamp(1.5rem, 4vw, 2.4rem);

    letter-spacing: 3px;

    margin-bottom: 12px;
}

/* DESCRIPTION */
.mode p {
    color: #999;

    font-size: 0.85rem;

    line-height: 1.6;

    letter-spacing: 1px;
}

/* ARROW */
.arrow {
    margin-top: 22px;

    font-size: 1rem;

    letter-spacing: 3px;

    color: white;
}

/* ALONE HOVER */
.alone:hover {
    border-color: #00e5ff;
}

/* SQUAD HOVER */
.squad:hover {
    border-color: #ff1744;
}

/* FOOTER */
.footer {
    margin-top: 55px;

    color: #555;

    font-size: 0.7rem;

    letter-spacing: 3px;
}

/* GLITCH */
@keyframes glitch {

    0%,
    90%,
    100% {
        transform: translate(0);
    }

    92% {
        transform: translate(-3px, 2px);
    }

    94% {
        transform: translate(3px, -2px);
    }

    96% {
        transform: translate(-2px, 1px);
    }
}

/* MOBILE */
@media (max-width: 700px) {

    body {
        overflow-y: auto;
        padding: 35px 0;
    }

    .modes {
        grid-template-columns: 1fr;
        gap: 20px;
    }

    .mode {
        min-height: 220px;
    }

    .question {
        margin-top: 45px;
    }

    .footer {
        margin-top: 35px;
    }
}
</style>
</head>

<body>

<div class="screen">

    <!-- LOGO -->
    <div class="logo">
        PIXEL RIOT
    </div>

    <div class="tagline">
        Enter the chaos.
    </div>


    <!-- QUESTION -->
    <div class="question">
        WHO'S PLAYING?
    </div>


    <!-- GAME MODES -->
    <div class="modes">

        <!-- ================= ALONE ================= -->

        <div
            class="mode alone"
            onclick="location.href='alone.html'"
        >

            <div class="icon">
                ◈
            </div>

            <h2>
                ALONE
            </h2>

            <p>
                SOLO GAMES.<br>
                NO FRIENDS. NO MERCY.
            </p>

            <div class="arrow">
                ENTER →
            </div>

        </div>


        <!-- ================= SQUAD ================= -->

        <div
            class="mode squad"
            onclick="location.href='squad.html'"
        >

            <div class="icon">
                ◆◆◆
            </div>

            <h2>
                SQUAD
            </h2>

            <p>
                GRAB YOUR FRIENDS.<br>
                TRUST NOBODY.
            </p>

            <div class="arrow">
                CREATE / JOIN →
            </div>

        </div>

    </div>


    <!-- FOOTER -->

    <div class="footer">
        PIXEL RIOT // 2026
    </div>

</div>

</body>
</html>
