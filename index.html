<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PIXEL RIOT</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at center, #151515 0%, #050505 65%);
            color: #fff;
            font-family: "Courier New", monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Subtle CRT scanlines */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(to bottom,
                    rgba(255, 255, 255, 0.025) 0px,
                    rgba(255, 255, 255, 0.025) 1px,
                    transparent 1px,
                    transparent 4px);
            z-index: 10;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 40px 25px;
            text-align: center;
        }

        /* LOGO */

        .logo {
            font-family: Impact, "Arial Black", sans-serif;
            font-size: clamp(55px, 10vw, 110px);
            letter-spacing: -5px;
            line-height: 0.9;
            text-transform: uppercase;

            color: #ffffff;

            text-shadow:
                5px 5px 0 #777,
                10px 10px 0 #222,
                0 0 25px rgba(255, 255, 255, 0.15);

            margin-bottom: 22px;
        }

        .tagline {
            color: #666;
            font-size: 13px;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 65px;
        }

        .question {
            font-size: 17px;
            font-weight: bold;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 25px;
            color: #aaa;
        }

        /* BUTTON AREA */

        .options {
            display: flex;
            justify-content: center;
            gap: 28px;
            flex-wrap: wrap;
        }

        /*
            RETRO ARCADE BUTTON
        */

        .option {
            width: 285px;
            min-height: 180px;

            position: relative;

            background: #0d0d0d;
            color: white;

            cursor: pointer;

            padding: 32px 20px;

            border: 4px solid #ffffff;

            /* Pixel-style shadow */
            box-shadow:
                7px 7px 0 #ffffff,
                12px 12px 0 #111;

            transition:
                transform 0.12s ease,
                box-shadow 0.12s ease,
                background 0.12s ease;
        }

        /* Pixel corners */

        .option::before,
        .option::after {
            content: "";
            position: absolute;
            width: 10px;
            height: 10px;
            background: #0d0d0d;
        }

        .option::before {
            top: -4px;
            left: -4px;
        }

        .option::after {
            bottom: -4px;
            right: -4px;
        }

        /* Scanline inside buttons */

        .option {
            background-image: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 5px,
                    rgba(255, 255, 255, 0.025) 5px,
                    rgba(255, 255, 255, 0.025) 6px);
        }

        /* HOVER */

        .option:hover {
            transform: translate(-4px, -4px);

            background-color: #171717;

            box-shadow:
                11px 11px 0 #ffffff,
                17px 17px 0 #111,
                0 0 30px rgba(255, 255, 255, 0.12);
        }

        /* CLICK */

        .option:active {
            transform: translate(5px, 5px);

            box-shadow:
                2px 2px 0 #ffffff,
                4px 4px 0 #111;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 18px;

            filter:
                grayscale(1) contrast(1.5);

            transition: transform 0.15s ease;
        }

        .option:hover .icon {
            transform: scale(1.12);
        }

        .option-title {
            font-family: Impact, "Arial Black", sans-serif;
            font-size: 24px;
            letter-spacing: 2px;
        }

        .option-subtitle {
            margin-top: 10px;

            color: #666;

            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Tiny arcade indicator */

        .option-title::before {
            content: "> ";
            color: #777;
        }

        /* COMING SOON */

        .coming {
            display: none;
            margin-top: 35px;

            color: #777;

            font-size: 12px;
            letter-spacing: 3px;

            text-transform: uppercase;

            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0.35;
            }
        }

        /* FOOTER */

        .footer {
            position: fixed;
            bottom: 18px;
            left: 0;
            width: 100%;

            text-align: center;

            color: #333;

            font-size: 10px;
            letter-spacing: 3px;
        }

        /* MOBILE */

        @media (max-width: 650px) {

            body {
                overflow-y: auto;
            }

            .container {
                padding: 35px 20px 70px;
            }

            .logo {
                letter-spacing: -3px;
            }

            .tagline {
                margin-bottom: 45px;
            }

            .options {
                gap: 25px;
            }

            .option {
                width: 100%;
                max-width: 320px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">
            PIXEL RIOT
        </div>

        <div class="tagline">
            Enter the chaos.
        </div>

        <div class="question">
            Who's playing?
        </div>

        <div class="options">

            <div class="option" onclick="comingSoon('ALONE')">

                <div class="icon">🎮</div>

                <div class="option-title">
                    ALONE
                </div>

                <div class="option-subtitle">
                    Solo arcade games
                </div>

            </div>


            <div class="option" onclick="comingSoon('SQUAD')">

                <div class="icon">👥</div>

                <div class="option-title">
                    GOT A SQUAD?
                </div>

                <div class="option-subtitle">
                    Play with your crew
                </div>

            </div>

        </div>

        <div class="coming" id="coming">
            <span id="comingText"></span>
        </div>

    </main>

    <div class="footer">
        PIXEL RIOT © 2026
    </div>


    <script>

        function comingSoon(type) {

            const message =
                document.getElementById("coming");

            const text =
                document.getElementById("comingText");

            text.textContent =
                type + " MODE — COMING SOON...";

            message.style.display = "block";
        }

    </script>

</body>

</html>
