<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PIXEL RIOT — Squad</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#050608;color:#fff;font-family:monospace;display:grid;place-items:center}.box{width:min(700px,94vw);background:#090c11;border:4px solid #fff;box-shadow:12px 12px #000;padding:30px}.k{font-size:11px;letter-spacing:4px;color:#777}h1{font-size:52px;margin:8px 0}.sub{color:#999;line-height:1.5}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}button,a{padding:13px 18px;background:#fff;color:#000;border:3px solid #fff;font:900 12px monospace;cursor:pointer;text-decoration:none}input{padding:13px;background:#111;color:#fff;border:3px solid #555;font:900 15px monospace;text-transform:uppercase;width:190px}.note{color:#777;margin-top:16px;font-size:11px;line-height:1.6}</style></head><body><main class="box"><div class="k">PIXEL RIOT // SQUAD</div><h1>GOT A SQUAD?</h1><div class="sub">Create a private room. Send the 6-character code to your friends. Everyone opens the same site and enters the code.</div><div class="row"><button id="create">CREATE ROOM</button></div><div class="row"><input id="code" maxlength="6" placeholder="ROOM CODE"><button id="join">JOIN ROOM</button></div><div id="msg" class="note"></div></main><script>const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';function c(){let s='';for(let i=0;i<6;i++)s+=A[Math.floor(Math.random()*A.length)];return s}create.onclick=()=>location.href='game-multiplayer.html?room='+c()+'&host=1';join.onclick=()=>{const x=code.value.trim().toUpperCase();if(x.length!==6){msg.textContent='Room code must be 6 characters.';return}location.href='game-multiplayer.html?room='+x+'&join=1'}</script></body></html>
