<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>PIXEL RIOT — PIXEL RACER</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at center, #171717 0%, #070707 55%, #000 100%);
            color: #fff;
            font-family: monospace;
            overflow: hidden;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 20;
            background: repeating-linear-gradient(to bottom,
                    rgba(255, 255, 255, .035) 0px,
                    rgba(255, 255, 255, .035) 1px,
                    transparent 1px,
                    transparent 4px);
        }

        .wrap {
            width: min(760px, 94vw);
            margin: auto;
            padding: 18px 0;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .back {
            color: #fff;
            text-decoration: none;
            font-weight: 900;
            font-size: 13px;
            border: 2px solid #fff;
            padding: 7px 10px;
            box-shadow: 4px 4px 0 #000;
        }

        .back:hover {
            background: #fff;
            color: #000;
        }

        .brand {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 3px;
            text-shadow: 3px 0 #ff1744, -3px 0 #00e5ff;
        }

        .gamebox {
            position: relative;
            width: 100%;
            max-width: 700px;
            margin: auto;
            border: 4px solid #fff;
            background: #070707;
            box-shadow: 8px 8px 0 #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            image-rendering: pixelated;
        }

        .hud {
            position: absolute;
            top: 12px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
            gap: 7px;
            pointer-events: none;
            font-size: 12px;
            font-weight: 900;
            text-shadow: 2px 2px #000;
        }

        .hud span {
            border: 2px solid #fff;
            background: #000;
            padding: 6px 9px;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: rgba(0, 0, 0, .82);
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        .title {
            font-size: clamp(36px, 8vw, 68px);
            font-weight: 900;
            letter-spacing: 5px;
            text-shadow: 5px 0 #ff1744, -5px 0 #00e5ff;
            margin-bottom: 12px;
        }

        .sub {
            font-size: 13px;
            line-height: 1.7;
            margin-bottom: 22px;
            color: #ddd;
        }

        .btn {
            border: 3px solid #fff;
            background: #fff;
            color: #000;
            padding: 12px 22px;
            font-family: monospace;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 5px 5px 0 #ff1744;
        }

        .btn:hover {
            transform: translate(2px, 2px);
            box-shadow: 3px 3px 0 #ff1744;
        }

        .tip {
            text-align: center;
            margin-top: 13px;
            font-size: 11px;
            color: #999;
        }

        .mobile {
            display: none;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
        }

        .mobile button {
            width: 70px;
            height: 48px;
            border: 2px solid #fff;
            background: #111;
            color: #fff;
            font: bold 18px monospace;
            touch-action: none;
        }

        .mobile button:active {
            background: #fff;
            color: #000;
        }

        @media(max-width:700px) {

            .wrap {
                padding-top: 10px;
            }

            .brand {
                font-size: 17px;
            }

            .tip {
                display: none;
            }

            .mobile {
                display: flex;
            }

        }
    </style>
</head>

<body>

    <div class="wrap">

        <div class="top">
            <a class="back" href="alone.html">← BACK</a>
            <div class="brand">PIXEL RIOT</div>
        </div>

        <div class="gamebox">

            <canvas id="game" width="700" height="600"></canvas>

            <div class="hud">
                <span>SCORE <b id="score">0</b></span>
                <span>BEST <b id="best">0</b></span>
                <span>SPEED <b id="speed">0</b></span>
                <span>🪙 <b id="coins">0</b></span>
            </div>

            <div class="overlay" id="start">

                <div class="title">RACER</div>

                <div class="sub">
                    DODGE THE TRAFFIC.<br>
                    PUSH YOUR SPEED.
                </div>

                <button class="btn" id="play">
                    START RIOT
                </button>

            </div>

            <div class="overlay hidden" id="over">

                <div class="title" id="overTitle">
                    CRASHED
                </div>

                <div class="sub">
                    SCORE: <b id="final">0</b><br>
                    COINS: <b id="finalCoins">0</b>
                </div>

                <button class="btn" id="again">
                    RETRY
                </button>

            </div>

        </div>

        <div class="tip">
            ← → / A D = STEER · AVOID TRAFFIC · COLLECT COINS
        </div>

        <div class="mobile">
            <button data-key="left">◀</button>
            <button data-key="right">▶</button>
        </div>

    </div>

    <script>

        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        const W = canvas.width;
        const H = canvas.height;

        const scoreEl = document.getElementById("score");
        const bestEl = document.getElementById("best");
        const speedEl = document.getElementById("speed");
        const coinsEl = document.getElementById("coins");

        const finalEl = document.getElementById("final");
        const finalCoinsEl = document.getElementById("finalCoins");

        const startScreen = document.getElementById("start");
        const overScreen = document.getElementById("over");
        const overTitle = document.getElementById("overTitle");

        const playBtn = document.getElementById("play");
        const againBtn = document.getElementById("again");

        let best =
            Number(localStorage.getItem("pixelRiotRacerBest") || 0);

        let player;
        let traffic = [];
        let coins = [];
        let particles = [];

        let roadOffset = 0;

        let score = 0;
        let coinCount = 0;
        let speed = 260;

        let running = false;
        let gameEnded = false;

        let trafficTimer = 0;
        let coinTimer = 0;

        let lastTime = 0;

        const keys = {
            left: false,
            right: false
        };

        bestEl.textContent = best;


        /* =========================
           ROAD
        ========================= */

        const road = {
            x: 150,
            width: 400,
            lanes: 4
        };

        const laneWidth =
            road.width / road.lanes;


        /* =========================
           PLAYER
        ========================= */

        function createPlayer() {

            return {
                lane: 1,
                x: road.x + laneWidth * 1.5,
                y: H - 100,
                w: 42,
                h: 70,
                targetX: 0,
                steer: 0
            };

        }


        /* =========================
           TRAFFIC
        ========================= */

        function spawnTraffic() {

            const lane =
                Math.floor(Math.random() * road.lanes);

            const colors = [
                "#ff1744",
                "#00e5ff",
                "#b400ff",
                "#fff"
            ];

            traffic.push({

                lane,

                x:
                    road.x +
                    laneWidth * lane +
                    laneWidth / 2,

                y: -90,

                w: 40,
                h: 68,

                speed:
                    speed * (.65 + Math.random() * .45),

                color:
                    colors[
                    Math.floor(
                        Math.random() * colors.length
                    )
                    ],

                wobble:
                    Math.random() * Math.PI * 2

            });

        }


        /* =========================
           COIN
        ========================= */

        function spawnCoin() {

            const lane =
                Math.floor(Math.random() * road.lanes);

            coins.push({

                x:
                    road.x +
                    laneWidth * lane +
                    laneWidth / 2,

                y: -30,

                r: 10,

                speed:
                    speed * .92

            });

        }


        /* =========================
           PARTICLES
        ========================= */

        function burst(x, y, count = 25) {

            for (let i = 0; i < count; i++) {

                const angle =
                    Math.random() * Math.PI * 2;

                const s =
                    50 + Math.random() * 240;

                particles.push({

                    x,
                    y,

                    vx:
                        Math.cos(angle) * s,

                    vy:
                        Math.sin(angle) * s,

                    life:
                        .3 + Math.random() * .7,

                    size:
                        2 + Math.random() * 5

                });

            }

        }


        /* =========================
           START
        ========================= */

        function startGame() {

            player = createPlayer();

            player.targetX =
                player.x;

            traffic = [];
            coins = [];
            particles = [];

            roadOffset = 0;

            score = 0;
            coinCount = 0;

            speed = 260;

            trafficTimer = .4;
            coinTimer = 1;

            running = true;
            gameEnded = false;

            scoreEl.textContent = 0;
            coinsEl.textContent = 0;
            speedEl.textContent = Math.floor(speed);

            startScreen.classList.add("hidden");
            overScreen.classList.add("hidden");

            lastTime =
                performance.now();

            requestAnimationFrame(loop);
        }


        /* =========================
           INPUT
        ========================= */

        window.addEventListener("keydown", e => {

            const k =
                e.key.toLowerCase();

            if (
                k === "a" ||
                e.key === "ArrowLeft"
            ) {
                keys.left = true;
            }

            if (
                k === "d" ||
                e.key === "ArrowRight"
            ) {
                keys.right = true;
            }

        });


        window.addEventListener("keyup", e => {

            const k =
                e.key.toLowerCase();

            if (
                k === "a" ||
                e.key === "ArrowLeft"
            ) {
                keys.left = false;
            }

            if (
                k === "d" ||
                e.key === "ArrowRight"
            ) {
                keys.right = false;
            }

        });


        /* MOBILE */

        document
            .querySelectorAll(".mobile button")
            .forEach(button => {

                const key =
                    button.dataset.key;

                button.addEventListener(
                    "pointerdown",
                    e => {
                        e.preventDefault();
                        keys[key] = true;
                    }
                );

                button.addEventListener(
                    "pointerup",
                    e => {
                        e.preventDefault();
                        keys[key] = false;
                    }
                );

                button.addEventListener(
                    "pointerleave",
                    () => {
                        keys[key] = false;
                    }
                );

            });


        /* =========================
           COLLISION
        ========================= */

        function collision(a, b) {

            return (
                a.x - a.w / 2 < b.x + b.w / 2 &&
                a.x + a.w / 2 > b.x - b.w / 2 &&
                a.y - a.h / 2 < b.y + b.h / 2 &&
                a.y + a.h / 2 > b.y - b.h / 2
            );

        }


        /* =========================
           COIN COLLISION
        ========================= */

        function coinCollision(car, coin) {

            const dx =
                car.x - coin.x;

            const dy =
                car.y - coin.y;

            return (
                dx * dx +
                dy * dy
                <
                35 * 35
            );

        }


        /* =========================
           UPDATE
        ========================= */

        function update(dt) {

            /* SPEED */

            speed += dt * 4;

            speed = Math.min(
                700,
                speed
            );

            speedEl.textContent =
                Math.floor(speed);


            /* SCORE */

            score += dt * speed * .035;

            scoreEl.textContent =
                Math.floor(score);


            /* ROAD */

            roadOffset += speed * dt;

            if (roadOffset > 100)
                roadOffset -= 100;


            /* STEERING */

            if (keys.left) {

                player.targetX -=
                    380 * dt;

            }

            if (keys.right) {

                player.targetX +=
                    380 * dt;

            }

            player.targetX =
                Math.max(
                    road.x + 25,
                    Math.min(
                        road.x +
                        road.width - 25,
                        player.targetX
                    )
                );

            player.x +=
                (player.targetX - player.x)
                * Math.min(1, dt * 10);


            /* TRAFFIC */

            trafficTimer -= dt;

            const trafficRate =
                Math.max(
                    .38,
                    .95 - score / 5000
                );

            if (trafficTimer <= 0) {

                spawnTraffic();

                trafficTimer =
                    trafficRate;
            }


            /* COINS */

            coinTimer -= dt;

            if (coinTimer <= 0) {

                spawnCoin();

                coinTimer =
                    1.3 +
                    Math.random() * .8;
            }


            /* MOVE TRAFFIC */

            for (const car of traffic) {

                car.y +=
                    car.speed * dt;

                car.wobble +=
                    dt * 3;

            }


            /* MOVE COINS */

            for (const coin of coins) {

                coin.y +=
                    coin.speed * dt;

            }


            /* TRAFFIC COLLISION */

            for (const car of traffic) {

                if (collision(player, car)) {

                    crash();
                    return;

                }

            }


            /* COIN COLLECTION */

            for (let i = coins.length - 1; i >= 0; i--) {

                if (
                    coinCollision(
                        player,
                        coins[i]
                    )
                ) {

                    coinCount++;

                    score += 250;

                    coinsEl.textContent =
                        coinCount;

                    burst(
                        coins[i].x,
                        coins[i].y,
                        12
                    );

                    coins.splice(i, 1);

                }

            }


            /* REMOVE OBJECTS */

            traffic =
                traffic.filter(
                    car => car.y < H + 120
                );

            coins =
                coins.filter(
                    coin => coin.y < H + 50
                );


            /* PARTICLES */

            for (const p of particles) {

                p.x += p.vx * dt;
                p.y += p.vy * dt;

                p.vx *= .985;
                p.vy *= .985;

                p.life -= dt;

            }

            particles =
                particles.filter(
                    p => p.life > 0
                );

        }


        /* =========================
           CRASH
        ========================= */

        function crash() {

            running = false;
            gameEnded = true;

            burst(
                player.x,
                player.y,
                60
            );

            const finalScore =
                Math.floor(score);

            finalEl.textContent =
                finalScore;

            finalCoinsEl.textContent =
                coinCount;


            if (finalScore > best) {

                best = finalScore;

                localStorage.setItem(
                    "pixelRiotRacerBest",
                    best
                );

                bestEl.textContent =
                    best;

                overTitle.textContent =
                    "NEW BEST!";

            } else {

                overTitle.textContent =
                    "CRASHED";

            }

            overScreen.classList.remove(
                "hidden"
            );

            draw();

        }


        /* =========================
           DRAW ROAD
        ========================= */

        function drawRoad() {

            /* GRASS */

            ctx.fillStyle = "#080808";

            ctx.fillRect(
                0, 0, W, H
            );


            /* ROAD */

            ctx.fillStyle = "#141414";

            ctx.fillRect(
                road.x,
                0,
                road.width,
                H
            );


            /* ROAD EDGES */

            ctx.fillStyle = "#ff1744";

            ctx.fillRect(
                road.x,
                0,
                7,
                H
            );

            ctx.fillRect(
                road.x +
                road.width - 7,
                0,
                7,
                H
            );


            /* LANE MARKINGS */

            ctx.fillStyle = "#eee";

            for (let lane = 1; lane < road.lanes; lane++) {

                const x =
                    road.x +
                    laneWidth * lane;

                for (
                    let y = -100 + roadOffset;
                    y < H;
                    y += 100
                ) {

                    ctx.fillRect(
                        x - 3,
                        y,
                        6,
                        52
                    );

                }

            }


            /* SIDE PIXELS */

            for (
                let y = -50 + roadOffset;
                y < H;
                y += 80
            ) {

                ctx.fillStyle =
                    y % 160 === 0
                        ? "#00e5ff"
                        : "#555";

                ctx.fillRect(
                    road.x - 25,
                    y,
                    12,
                    8
                );

                ctx.fillRect(
                    road.x +
                    road.width + 13,
                    y,
                    12,
                    8
                );

            }

        }


        /* =========================
           DRAW CAR
        ========================= */

        function drawCar(car, isPlayer = false) {

            ctx.save();

            ctx.translate(
                car.x,
                car.y
            );

            if (!isPlayer) {

                ctx.rotate(
                    Math.sin(car.wobble) * .025
                );

            }


            /* BODY */

            ctx.fillStyle =
                isPlayer
                    ? "#00e5ff"
                    : car.color;

            ctx.fillRect(
                -car.w / 2,
                -car.h / 2,
                car.w,
                car.h
            );


            /* WINDOWS */

            ctx.fillStyle = "#050505";

            ctx.fillRect(
                -13,
                -23,
                26,
                18
            );

            ctx.fillRect(
                -13,
                6,
                26,
                15
            );


            /* WINDOW HIGHLIGHT */

            ctx.fillStyle = "#fff";

            ctx.fillRect(
                -9,
                -20,
                18,
                3
            );


            /* LIGHTS */

            ctx.fillStyle =
                isPlayer
                    ? "#fff"
                    : "#ff1744";

            ctx.fillRect(
                -15,
                -car.h / 2 - 1,
                9,
                5
            );

            ctx.fillRect(
                6,
                -car.h / 2 - 1,
                9,
                5
            );


            /* BUMPERS */

            ctx.strokeStyle = "#fff";

            ctx.lineWidth = 2;

            ctx.strokeRect(
                -car.w / 2,
                -car.h / 2,
                car.w,
                car.h
            );


            /* PLAYER ARROW */

            if (isPlayer) {

                ctx.fillStyle = "#fff";

                ctx.beginPath();

                ctx.moveTo(
                    0,
                    -car.h / 2 - 10
                );

                ctx.lineTo(
                    -6,
                    -car.h / 2
                );

                ctx.lineTo(
                    6,
                    -car.h / 2
                );

                ctx.closePath();

                ctx.fill();

            }

            ctx.restore();

        }


        /* =========================
           DRAW COIN
        ========================= */

        function drawCoin(coin) {

            ctx.save();

            ctx.translate(
                coin.x,
                coin.y
            );

            ctx.fillStyle = "#ffd400";

            ctx.beginPath();

            ctx.arc(
                0,
                0,
                coin.r,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.strokeStyle = "#fff";

            ctx.lineWidth = 2;

            ctx.stroke();

            ctx.fillStyle = "#000";

            ctx.font = "900 12px monospace";

            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            ctx.fillText(
                "$",
                0,
                1
            );

            ctx.restore();

        }


        /* =========================
           DRAW
        ========================= */

        function draw() {

            drawRoad();


            /* TRAFFIC */

            for (const car of traffic) {

                drawCar(
                    car,
                    false
                );

            }


            /* COINS */

            for (const coin of coins) {

                drawCoin(coin);

            }


            /* PLAYER */

            if (player) {

                drawCar(
                    {
                        x: player.x,
                        y: player.y,
                        w: player.w,
                        h: player.h
                    },
                    true
                );

            }


            /* PARTICLES */

            for (const p of particles) {

                ctx.globalAlpha =
                    Math.max(0, p.life);

                ctx.fillStyle = "#fff";

                ctx.fillRect(
                    p.x,
                    p.y,
                    p.size,
                    p.size
                );

            }

            ctx.globalAlpha = 1;


            /* DISTANCE */

            ctx.fillStyle =
                "rgba(255,255,255,.55)";

            ctx.font =
                "900 11px monospace";

            ctx.fillText(
                "DISTANCE " + Math.floor(score) + "M",
                14,
                H - 14
            );

        }


        /* =========================
           LOOP
        ========================= */

        function loop(time) {

            if (!running)
                return;

            const dt =
                Math.min(
                    (time - lastTime) / 1000,
                    .035
                );

            lastTime = time;

            update(dt);
            draw();

            if (running) {

                requestAnimationFrame(
                    loop
                );

            }

        }


        /* =========================
           BUTTONS
        ========================= */

        playBtn.addEventListener(
            "click",
            startGame
        );

        againBtn.addEventListener(
            "click",
            startGame
        );


        /* =========================
           INITIAL
        ========================= */

        player = createPlayer();

        traffic = [];
        coins = [];
        particles = [];

        draw();

    </script>

</body>

</html>
