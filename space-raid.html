<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>PIXEL RIOT — SPACE RAID</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at center, #151515 0%, #060606 58%, #000 100%);
            color: #fff;
            font-family: monospace;
            overflow: hidden;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 20;
            background: repeating-linear-gradient(to bottom,
                    rgba(255, 255, 255, .035) 0px,
                    rgba(255, 255, 255, .035) 1px,
                    transparent 1px,
                    transparent 4px);
        }

        .wrap {
            width: min(760px, 94vw);
            margin: auto;
            padding: 18px 0;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .back {
            color: #fff;
            text-decoration: none;
            font-weight: 900;
            font-size: 13px;
            border: 2px solid #fff;
            padding: 7px 10px;
            box-shadow: 4px 4px 0 #000;
        }

        .back:hover {
            background: #fff;
            color: #000;
        }

        .brand {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 3px;
            text-shadow: 3px 0 #ff1744, -3px 0 #00e5ff;
        }

        .gamebox {
            position: relative;
            width: 100%;
            max-width: 700px;
            margin: auto;
            border: 4px solid #fff;
            background: #020205;
            box-shadow: 8px 8px 0 #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            image-rendering: pixelated;
        }

        .hud {
            position: absolute;
            top: 12px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
            gap: 8px;
            pointer-events: none;
            font-size: 12px;
            font-weight: 900;
            text-shadow: 2px 2px #000;
        }

        .hud span {
            border: 2px solid #fff;
            background: #000;
            padding: 6px 9px;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: rgba(0, 0, 0, .82);
            text-align: center;
        }

        .hidden {
            display: none !important
        }

        .title {
            font-size: clamp(36px, 8vw, 68px);
            font-weight: 900;
            letter-spacing: 5px;
            text-shadow: 5px 0 #ff1744, -5px 0 #00e5ff;
            margin-bottom: 12px;
        }

        .sub {
            font-size: 13px;
            line-height: 1.7;
            margin-bottom: 22px;
            color: #ddd;
        }

        .btn {
            border: 3px solid #fff;
            background: #fff;
            color: #000;
            padding: 12px 22px;
            font-family: monospace;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 5px 5px 0 #ff1744;
        }

        .btn:hover {
            transform: translate(2px, 2px);
            box-shadow: 3px 3px 0 #ff1744;
        }

        .tip {
            text-align: center;
            margin-top: 13px;
            font-size: 11px;
            color: #999;
        }

        .mobile {
            display: none;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
        }

        .mobile button {
            width: 58px;
            height: 45px;
            border: 2px solid #fff;
            background: #111;
            color: #fff;
            font: bold 18px monospace;
            touch-action: none;
        }

        .mobile button:active {
            background: #fff;
            color: #000;
        }

        @media(max-width:700px) {
            .wrap {
                padding-top: 10px
            }

            .brand {
                font-size: 17px
            }

            .tip {
                display: none
            }

            .mobile {
                display: flex
            }
        }
    </style>
</head>

<body>

    <div class="wrap">

        <div class="top">
            <a class="back" href="alone.html">← BACK</a>
            <div class="brand">PIXEL RIOT</div>
        </div>

        <div class="gamebox">

            <canvas id="game" width="700" height="600"></canvas>

            <div class="hud">
                <span>SCORE <b id="score">0</b></span>
                <span>BEST <b id="best">0</b></span>
                <span>WAVE <b id="wave">1</b></span>
                <span>❤️ <b id="lives">3</b></span>
            </div>

            <div class="overlay" id="start">

                <div class="title">SPACE RAID</div>

                <div class="sub">
                    SURVIVE THE VOID.<br>
                    DESTROY EVERYTHING.
                </div>

                <button class="btn" id="play">
                    START RIOT
                </button>

            </div>

            <div class="overlay hidden" id="over">

                <div class="title" id="overTitle">GAME OVER</div>

                <div class="sub">
                    SCORE: <b id="final">0</b>
                </div>

                <button class="btn" id="again">
                    RETRY
                </button>

            </div>

        </div>

        <div class="tip">
            WASD / ARROWS = MOVE · SPACE / CLICK = FIRE
        </div>

        <div class="mobile">
            <button data-key="left">◀</button>
            <button data-key="fire">●</button>
            <button data-key="right">▶</button>
        </div>

    </div>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        const W = canvas.width;
        const H = canvas.height;

        const scoreEl = document.getElementById("score");
        const bestEl = document.getElementById("best");
        const waveEl = document.getElementById("wave");
        const livesEl = document.getElementById("lives");
        const finalEl = document.getElementById("final");

        const startScreen = document.getElementById("start");
        const overScreen = document.getElementById("over");
        const overTitle = document.getElementById("overTitle");

        const playBtn = document.getElementById("play");
        const againBtn = document.getElementById("again");

        let best = Number(localStorage.getItem("pixelRiotSpaceRaidBest") || 0);

        let player;
        let bullets = [];
        let enemies = [];
        let enemyBullets = [];
        let particles = [];
        let stars = [];

        let score = 0;
        let lives = 3;
        let wave = 1;

        let running = false;
        let gameEnded = false;

        let spawnTimer = 0;
        let fireTimer = 0;
        let waveTimer = 0;

        let lastTime = 0;

        const keys = {
            left: false,
            right: false,
            up: false,
            down: false,
            fire: false
        };

        bestEl.textContent = best;


        /* =========================
           STARS
        ========================= */

        for (let i = 0; i < 130; i++) {
            stars.push({
                x: Math.random() * W,
                y: Math.random() * H,
                size: Math.random() * 2 + 1,
                speed: 20 + Math.random() * 80
            });
        }


        /* =========================
           PLAYER
        ========================= */

        function createPlayer() {
            return {
                x: W / 2,
                y: H - 70,
                w: 34,
                h: 30,
                speed: 360,
                invincible: 0
            };
        }


        /* =========================
           START
        ========================= */

        function startGame() {

            player = createPlayer();

            bullets = [];
            enemies = [];
            enemyBullets = [];
            particles = [];

            score = 0;
            lives = 3;
            wave = 1;

            spawnTimer = .5;
            fireTimer = 0;
            waveTimer = 0;

            running = true;
            gameEnded = false;

            scoreEl.textContent = 0;
            livesEl.textContent = 3;
            waveEl.textContent = 1;

            startScreen.classList.add("hidden");
            overScreen.classList.add("hidden");

            lastTime = performance.now();

            requestAnimationFrame(loop);
        }


        /* =========================
           INPUT
        ========================= */

        window.addEventListener("keydown", e => {

            const k = e.key.toLowerCase();

            if (k === "a" || e.key === "ArrowLeft") keys.left = true;
            if (k === "d" || e.key === "ArrowRight") keys.right = true;
            if (k === "w" || e.key === "ArrowUp") keys.up = true;
            if (k === "s" || e.key === "ArrowDown") keys.down = true;

            if (e.code === "Space") {
                e.preventDefault();
                keys.fire = true;

                if (!running && gameEnded) startGame();
            }

        });

        window.addEventListener("keyup", e => {

            const k = e.key.toLowerCase();

            if (k === "a" || e.key === "ArrowLeft") keys.left = false;
            if (k === "d" || e.key === "ArrowRight") keys.right = false;
            if (k === "w" || e.key === "ArrowUp") keys.up = false;
            if (k === "s" || e.key === "ArrowDown") keys.down = false;

            if (e.code === "Space") keys.fire = false;

        });


        /* MOBILE */

        document.querySelectorAll(".mobile button").forEach(btn => {

            const key = btn.dataset.key;

            btn.addEventListener("pointerdown", e => {
                e.preventDefault();
                keys[key] = true;
            });

            btn.addEventListener("pointerup", e => {
                e.preventDefault();
                keys[key] = false;
            });

            btn.addEventListener("pointerleave", () => {
                keys[key] = false;
            });

        });


        /* =========================
           FIRE
        ========================= */

        function fire() {

            if (fireTimer > 0) return;

            bullets.push({
                x: player.x,
                y: player.y - 20,
                w: 5,
                h: 16,
                speed: 620
            });

            fireTimer = .18;
        }


        /* =========================
           ENEMY SPAWN
        ========================= */

        function spawnEnemy() {

            const type = Math.random();

            let enemy;

            if (type < .65) {

                enemy = {
                    type: "scout",
                    x: 30 + Math.random() * (W - 60),
                    y: -40,
                    w: 30,
                    h: 26,
                    speed: 70 + wave * 5,
                    hp: 1,
                    points: 100,
                    phase: Math.random() * Math.PI * 2,
                    shoot: false
                };

            } else if (type < .9) {

                enemy = {
                    type: "hunter",
                    x: 30 + Math.random() * (W - 60),
                    y: -45,
                    w: 38,
                    h: 32,
                    speed: 45 + wave * 4,
                    hp: 2,
                    points: 220,
                    phase: Math.random() * Math.PI * 2,
                    shoot: true,
                    shotTimer: 1 + Math.random()
                };

            } else {

                enemy = {
                    type: "asteroid",
                    x: 30 + Math.random() * (W - 60),
                    y: -50,
                    w: 44,
                    h: 44,
                    speed: 80 + wave * 3,
                    hp: 3,
                    points: 300,
                    phase: Math.random() * Math.PI * 2,
                    shoot: false,
                    rotation: Math.random() * Math.PI
                };

            }

            enemies.push(enemy);
        }


        /* =========================
           PARTICLES
        ========================= */

        function explode(x, y, count = 20) {

            for (let i = 0; i < count; i++) {

                const a = Math.random() * Math.PI * 2;
                const s = 60 + Math.random() * 240;

                particles.push({
                    x, y,
                    vx: Math.cos(a) * s,
                    vy: Math.sin(a) * s,
                    life: .3 + Math.random() * .7,
                    size: 2 + Math.random() * 4
                });
            }
        }


        /* =========================
           COLLISION
        ========================= */

        function hit(a, b) {

            return (
                a.x - a.w / 2 < b.x + b.w / 2 &&
                a.x + a.w / 2 > b.x - b.w / 2 &&
                a.y - a.h / 2 < b.y + b.h / 2 &&
                a.y + a.h / 2 > b.y - b.h / 2
            );
        }


        /* =========================
           UPDATE
        ========================= */

        function update(dt) {

            /* STARS */

            for (const s of stars) {

                s.y += s.speed * dt;

                if (s.y > H) {
                    s.y = -5;
                    s.x = Math.random() * W;
                }
            }


            /* PLAYER */

            let dx = 0;
            let dy = 0;

            if (keys.left) dx--;
            if (keys.right) dx++;
            if (keys.up) dy--;
            if (keys.down) dy++;

            if (dx || dy) {

                const len = Math.hypot(dx, dy);

                dx /= len;
                dy /= len;

                player.x += dx * player.speed * dt;
                player.y += dy * player.speed * dt;
            }

            player.x = Math.max(25, Math.min(W - 25, player.x));
            player.y = Math.max(80, Math.min(H - 30, player.y));


            /* FIRE */

            fireTimer -= dt;

            if (keys.fire) fire();


            /* INVINCIBILITY */

            if (player.invincible > 0) {
                player.invincible -= dt;
            }


            /* BULLETS */

            for (const b of bullets) {
                b.y -= b.speed * dt;
            }

            bullets = bullets.filter(b => b.y > -30);


            /* SPAWN */

            spawnTimer -= dt;

            const spawnRate = Math.max(
                .22,
                .8 - wave * .025
            );

            if (spawnTimer <= 0) {

                spawnEnemy();

                spawnTimer = spawnRate;
            }


            /* ENEMIES */

            for (const e of enemies) {

                e.y += e.speed * dt;

                if (e.type === "scout") {

                    e.x += Math.sin(
                        performance.now() / 500 + e.phase
                    ) * 35 * dt;

                }

                if (e.type === "hunter") {

                    const target =
                        player.x;

                    if (target > e.x) e.x += 35 * dt;
                    if (target < e.x) e.x -= 35 * dt;

                    e.shotTimer -= dt;

                    if (e.shotTimer <= 0) {

                        enemyBullets.push({
                            x: e.x,
                            y: e.y + 15,
                            w: 7,
                            h: 14,
                            speed: 220 + wave * 5
                        });

                        e.shotTimer =
                            Math.max(.7, 1.8 - wave * .02);
                    }
                }

                if (e.type === "asteroid") {
                    e.rotation += dt * 2;
                }
            }


            /* ENEMY BULLETS */

            for (const b of enemyBullets) {
                b.y += b.speed * dt;
            }

            enemyBullets =
                enemyBullets.filter(b => b.y < H + 30);


            /* BULLET -> ENEMY */

            for (let i = enemies.length - 1; i >= 0; i--) {

                const e = enemies[i];

                for (let j = bullets.length - 1; j >= 0; j--) {

                    const b = bullets[j];

                    if (hit(
                        { x: b.x, y: b.y, w: b.w, h: b.h },
                        e
                    )) {

                        bullets.splice(j, 1);

                        e.hp--;

                        explode(b.x, b.y, 5);

                        if (e.hp <= 0) {

                            score += e.points;

                            scoreEl.textContent =
                                Math.floor(score);

                            explode(
                                e.x,
                                e.y,
                                e.type === "asteroid" ? 30 : 20
                            );

                            enemies.splice(i, 1);

                        }

                        break;
                    }
                }
            }


            /* ENEMY -> PLAYER */

            if (player.invincible <= 0) {

                for (let i = enemies.length - 1; i >= 0; i--) {

                    const e = enemies[i];

                    if (hit(player, e)) {

                        enemies.splice(i, 1);

                        damagePlayer();

                        break;
                    }
                }

                for (let i = enemyBullets.length - 1; i >= 0; i--) {

                    const b = enemyBullets[i];

                    if (hit(player, b)) {

                        enemyBullets.splice(i, 1);

                        damagePlayer();

                        break;
                    }
                }
            }


            /* REMOVE PASSED ENEMIES */

            enemies =
                enemies.filter(e => e.y < H + 70);


            /* WAVE */

            waveTimer += dt;

            if (waveTimer >= 20) {

                wave++;

                waveTimer = 0;

                waveEl.textContent = wave;

                explode(W / 2, 120, 30);
            }


            /* PARTICLES */

            for (const p of particles) {

                p.x += p.vx * dt;
                p.y += p.vy * dt;

                p.vx *= .985;
                p.vy *= .985;

                p.life -= dt;
            }

            particles =
                particles.filter(p => p.life > 0);
        }


        /* =========================
           DAMAGE
        ========================= */

        function damagePlayer() {

            lives--;

            livesEl.textContent = lives;

            player.invincible = 2;

            explode(player.x, player.y, 35);

            if (lives <= 0) {

                endGame();

            }
        }


        /* =========================
           DRAW
        ========================= */

        function draw() {

            ctx.fillStyle = "#020205";
            ctx.fillRect(0, 0, W, H);


            /* STARS */

            for (const s of stars) {

                ctx.fillStyle =
                    s.size > 2 ? "#fff" : "#777";

                ctx.fillRect(
                    s.x,
                    s.y,
                    s.size,
                    s.size
                );
            }


            /* BULLETS */

            for (const b of bullets) {

                ctx.fillStyle = "#00e5ff";

                ctx.fillRect(
                    b.x - b.w / 2,
                    b.y - b.h / 2,
                    b.w,
                    b.h
                );
            }


            /* ENEMY BULLETS */

            for (const b of enemyBullets) {

                ctx.fillStyle = "#ff1744";

                ctx.fillRect(
                    b.x - b.w / 2,
                    b.y - b.h / 2,
                    b.w,
                    b.h
                );
            }


            /* ENEMIES */

            for (const e of enemies) {

                ctx.save();

                ctx.translate(e.x, e.y);

                if (e.type === "asteroid") {

                    ctx.rotate(e.rotation);

                    ctx.fillStyle = "#777";

                    ctx.beginPath();

                    ctx.moveTo(0, -e.h / 2);
                    ctx.lineTo(e.w / 2, -10);
                    ctx.lineTo(e.w / 2, 12);
                    ctx.lineTo(8, e.h / 2);
                    ctx.lineTo(-e.w / 2, 10);
                    ctx.lineTo(-e.w / 2, -15);

                    ctx.closePath();
                    ctx.fill();

                    ctx.strokeStyle = "#fff";
                    ctx.lineWidth = 2;
                    ctx.stroke();

                } else {

                    ctx.fillStyle =
                        e.type === "hunter"
                            ? "#ff1744"
                            : "#b400ff";

                    ctx.fillRect(
                        -e.w / 2,
                        -e.h / 2,
                        e.w,
                        e.h
                    );

                    ctx.fillStyle = "#fff";

                    ctx.fillRect(-9, -4, 6, 6);
                    ctx.fillRect(3, -4, 6, 6);

                    ctx.fillStyle = "#000";

                    ctx.fillRect(-7, -2, 3, 3);
                    ctx.fillRect(5, -2, 3, 3);

                    ctx.strokeStyle = "#fff";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(
                        -e.w / 2,
                        -e.h / 2,
                        e.w,
                        e.h
                    );
                }

                ctx.restore();
            }


            /* PLAYER */

            if (player && (
                player.invincible <= 0 ||
                Math.floor(player.invincible * 10) % 2 === 0
            )) {

                ctx.save();

                ctx.translate(
                    player.x,
                    player.y
                );

                /* flame */

                ctx.fillStyle = "#ff1744";

                ctx.beginPath();

                ctx.moveTo(-7, 15);
                ctx.lineTo(0, 27 + Math.random() * 7);
                ctx.lineTo(7, 15);

                ctx.closePath();
                ctx.fill();


                /* ship */

                ctx.fillStyle = "#00e5ff";

                ctx.beginPath();

                ctx.moveTo(0, -19);
                ctx.lineTo(18, 16);
                ctx.lineTo(0, 9);
                ctx.lineTo(-18, 16);

                ctx.closePath();

                ctx.fill();

                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 3;
                ctx.stroke();


                /* cockpit */

                ctx.fillStyle = "#fff";

                ctx.fillRect(
                    -5, -7,
                    10, 10
                );

                ctx.restore();
            }


            /* PARTICLES */

            for (const p of particles) {

                ctx.globalAlpha =
                    Math.max(0, p.life);

                ctx.fillStyle = "#fff";

                ctx.fillRect(
                    p.x,
                    p.y,
                    p.size,
                    p.size
                );
            }

            ctx.globalAlpha = 1;


            /* WAVE TEXT */

            if (waveTimer < 2) {

                ctx.textAlign = "center";

                ctx.fillStyle =
                    `rgba(255,255,255,${Math.max(
                        0,
                        1 - waveTimer / 2
                    )})`;

                ctx.font = "900 28px monospace";

                ctx.fillText(
                    "WAVE " + wave,
                    W / 2,
                    H / 2
                );

                ctx.textAlign = "left";
            }

        }


        /* =========================
           GAME OVER
        ========================= */

        function endGame() {

            running = false;
            gameEnded = true;

            const finalScore = Math.floor(score);

            finalEl.textContent = finalScore;

            if (finalScore > best) {

                best = finalScore;

                localStorage.setItem(
                    "pixelRiotSpaceRaidBest",
                    best
                );

                bestEl.textContent = best;

                overTitle.textContent = "NEW BEST!";

            } else {

                overTitle.textContent = "GAME OVER";

            }

            overScreen.classList.remove("hidden");

            draw();
        }


        /* =========================
           LOOP
        ========================= */

        function loop(time) {

            if (!running) return;

            const dt = Math.min(
                (time - lastTime) / 1000,
                .035
            );

            lastTime = time;

            update(dt);
            draw();

            if (running) {
                requestAnimationFrame(loop);
            }
        }


        /* =========================
           BUTTONS
        ========================= */

        playBtn.addEventListener(
            "click",
            startGame
        );

        againBtn.addEventListener(
            "click",
            startGame
        );


        /* =========================
           INITIAL
        ========================= */

        player = createPlayer();
        bullets = [];
        enemies = [];
        enemyBullets = [];
        particles = [];

        draw();

    </script>

</body>

</html>
